name: Android Agent

on:
  workflow_dispatch:
  push:
    branches:
      - agent/android-v1
    paths:
      - "apps/android/**"
      - "scripts/build-android"
      - ".github/workflows/android-agent.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        shell: bash
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Unit tests and APK
        run: gradle -p apps/android testDebugUnitTest assembleDebug --stacktrace

      - name: Package artifact
        run: |
          cp apps/android/app/build/outputs/apk/debug/app-debug.apk OpenDots-Agent-Android.apk
          sha256sum OpenDots-Agent-Android.apk | tee OpenDots-Agent-Android.sha256
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging OpenDots-Agent-Android.apk | head -20

      - uses: actions/upload-artifact@v4
        with:
          name: OpenDots-Agent-Android
          path: |
            OpenDots-Agent-Android.apk
            OpenDots-Agent-Android.sha256
          if-no-files-found: error
          retention-days: 14
