name: Android Agent PR

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android build + tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Run Android unit tests
        run: gradle -p apps/android testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle -p apps/android assembleDebug --stacktrace

      - name: Prepare APK artifact
        run: |
          cp apps/android/app/build/outputs/apk/debug/app-debug.apk OpenDots-Agent-Android.apk
          sha256sum OpenDots-Agent-Android.apk | tee OpenDots-Agent-Android.apk.sha256
          test -s OpenDots-Agent-Android.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenDots-Agent-Android
          path: |
            OpenDots-Agent-Android.apk
            OpenDots-Agent-Android.apk.sha256
          if-no-files-found: error
          retention-days: 14

  server:
    name: Existing server regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r server/requirements.txt pytest
      - run: PYTHONPATH=server pytest -q server/tests

  web:
    name: Existing web build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - working-directory: client
        run: npm install --no-audit --no-fund
      - working-directory: client
        run: npm run build
